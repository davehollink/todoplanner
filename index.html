<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FocusPlanner</title>
    
    <!-- PWA & App Icons -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#F4F6F8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="FocusPlanner">
    <link rel="apple-touch-icon" href="/focusplanner-icon.png">
    <link rel="icon" type="image/png" href="/focusplanner-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F4F6F8; color: #1A1A1A; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        .tab-content { display: none; animation: fadeIn 0.2s ease-in-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .calendar-scroll { -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
        .calendar-item { scroll-snap-align: center; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }
        .animate-fade-out { animation: fadeOut 0.5s ease-in-out forwards; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen pb-32 relative selection:bg-[#20B271] selection:text-white overflow-x-hidden">

    <div id="login-screen" class="fixed inset-0 bg-[#F4F6F8] z-[100] flex flex-col items-center justify-center p-6 transition-opacity duration-500">
        <div class="text-center mb-16">
            <img src="focusplanner-icon.png" alt="FocusPlanner Icon" class="w-24 h-24 rounded-[2rem] shadow-xl mx-auto mb-6 border-4 border-white object-cover bg-white">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">FocusPlanner</h1>
            <p class="text-gray-500 mt-3 font-medium">Jouw persoonlijke doelen en taken, overal gesynchroniseerd.</p>
        </div>
        
        <div class="w-full max-w-xs space-y-4">
            <button onclick="window.loginWithGoogle()" class="w-full bg-white px-6 py-4 rounded-2xl shadow-[0_4px_15px_rgba(0,0,0,0.05)] border border-gray-100 flex items-center justify-center space-x-3 hover:bg-gray-50 active:scale-95 transition-all font-bold text-gray-700">
                <svg class="w-6 h-6" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                </svg>
                <span>Doorgaan met Google</span>
            </button>
        </div>
    </div>

    <header class="sticky top-0 z-40 bg-[#F4F6F8]/90 backdrop-blur-md pt-8 pb-4 border-b border-gray-200">
        <div class="px-6 flex justify-between items-center mb-6">
            <div>
                <h1 id="user-greeting" class="text-[28px] font-extrabold leading-tight tracking-tight text-gray-900">Welkom!</h1>
            </div>
            <div id="avatar-container" onclick="window.logoutGoogle()" class="relative cursor-pointer hover:opacity-80 transition-opacity" title="Uitloggen">
                <div class="w-12 h-12 rounded-full bg-gray-200 border-2 border-white shadow-sm flex items-center justify-center">👤</div>
            </div>
        </div>

        <div class="px-6" id="calendar-container">
            <div class="flex items-center justify-between mb-3">
                <h2 class="font-bold text-lg capitalize" id="current-month-text">Kalender</h2>
                <div class="flex items-center space-x-2">
                    <div class="relative w-8 h-8 flex items-center justify-center bg-white rounded-full shadow-sm border border-gray-200 cursor-pointer overflow-hidden hover:bg-gray-50 transition-colors">
                        <span class="text-sm pointer-events-none">📅</span>
                        <input type="date" onchange="window.selectDateFromPicker(this.value)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" title="Kies een datum">
                    </div>
                    <button onclick="window.resetToToday()" class="bg-white px-3 py-1.5 rounded-full text-xs font-bold shadow-sm border border-gray-200 flex items-center text-gray-700 hover:bg-gray-50 active:scale-95 transition-transform">
                        Vandaag
                    </button>
                </div>
            </div>
            <div class="flex space-x-3 overflow-x-auto calendar-scroll pb-2" id="calendar-strip"></div>
        </div>
    </header>

    <main id="view-vandaag" class="tab-content active px-6 mt-6 space-y-4 relative z-10">
        <div class="flex justify-between items-end mb-2">
            <h2 class="text-2xl font-bold">Mijn taken</h2>
        </div>
        <div id="task-list" class="space-y-4 pb-8"></div>
    </main>

    <main id="view-uitdaging" class="tab-content px-6 mt-6 relative z-10">
        <h2 class="text-2xl font-bold mb-4">Mijn doelen</h2>
        <div class="bg-gray-900 rounded-[2rem] p-6 text-white shadow-xl mb-6 flex justify-between items-center">
            <div>
                <span class="bg-[#20B271] text-white text-[10px] font-bold px-2 py-1 rounded-md uppercase tracking-wider">Progressie</span>
                <h2 class="text-xl font-bold mt-2">Goede voortgang! 👍</h2>
            </div>
            <div class="w-16 h-16 rounded-full border-4 border-gray-700 flex items-center justify-center relative shrink-0">
                <span id="daily-focus-text" class="text-sm font-bold">0%</span>
                <svg class="absolute inset-0 w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                    <path class="text-gray-700" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3"/>
                    <path id="daily-focus-circle" class="text-[#20B271] transition-all duration-700 ease-out" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3"/>
                </svg>
            </div>
        </div>
        <div id="habit-list" class="space-y-4 pb-8"></div>
    </main>

    <main id="view-journal" class="tab-content px-6 mt-6 relative z-10">
        <h2 class="text-2xl font-bold mb-4">Mijn journal</h2>
        <button onclick="window.openSmartModal()" class="w-full py-4 rounded-2xl bg-[#20B271]/10 text-[#20B271] font-bold border border-[#20B271]/20 hover:bg-[#20B271]/20 transition-colors mb-6 shadow-sm flex justify-center items-center">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
            Schrijf een notitie...
        </button>
        <div id="journal-list" class="space-y-4 pb-8"></div>
    </main>

    <main id="view-ontdek" class="tab-content px-6 mt-6 relative z-10">
        <h2 class="text-2xl font-bold mb-4">Vind nieuwe gewoontes</h2>
        
        <button onclick="window.openCustomHabitModal()" class="w-full py-4 rounded-2xl bg-white text-[#20B271] font-bold border-2 border-dashed border-[#20B271]/40 hover:bg-gray-50 transition-colors mb-6 shadow-sm flex justify-center items-center">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Zelf een gewoonte bedenken
        </button>

        <div class="relative mb-6">
            <input type="text" id="search-discover" oninput="window.filterDiscover()" placeholder="Zoek in de lijst..." class="w-full p-4 pl-12 bg-white border border-gray-200 rounded-2xl outline-none focus:ring-2 focus:ring-[#20B271] text-gray-900 placeholder-gray-400 shadow-sm transition-all">
            <svg class="w-5 h-5 absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
        <div id="discover-list" class="grid grid-cols-2 gap-4 pb-8"></div>
    </main>

    <div class="fixed bottom-6 left-0 right-0 mx-auto w-full max-w-md px-6 z-40 pointer-events-none">
        <nav class="bg-white rounded-[2rem] shadow-[0_10px_40px_rgba(0,0,0,0.08)] py-4 grid grid-cols-5 place-items-center border border-gray-100 pointer-events-auto relative">
            <button onclick="window.switchTab('vandaag')" id="nav-vandaag" class="nav-btn flex flex-col items-center text-[#20B271] w-full">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                <span class="text-[10px] font-bold">Taken</span>
            </button>
            <button onclick="window.switchTab('uitdaging')" id="nav-uitdaging" class="nav-btn flex flex-col items-center text-gray-400 hover:text-[#20B271] w-full">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                <span class="text-[10px] font-semibold">Doelen</span>
            </button>
            
            <div class="w-full flex justify-center relative">
                <button onclick="window.openSmartModal()" class="absolute -top-12 w-16 h-16 bg-gradient-to-tr from-[#20B271] to-[#34d399] text-white rounded-full shadow-[0_10px_25px_rgba(32,178,113,0.5)] flex items-center justify-center hover:scale-105 active:scale-95 transition-all duration-300 border-[5px] border-[#F4F6F8]">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"><path d="M12 5v14m-7-7h14"></path></svg>
                </button>
            </div>

            <button onclick="window.switchTab('journal')" id="nav-journal" class="nav-btn flex flex-col items-center text-gray-400 hover:text-[#20B271] w-full">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                <span class="text-[10px] font-semibold">Journal</span>
            </button>
            <button onclick="window.switchTab('ontdek')" id="nav-ontdek" class="nav-btn flex flex-col items-center text-gray-400 hover:text-[#20B271] w-full">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <span class="text-[10px] font-semibold">Ontdek</span>
            </button>
        </nav>
    </div>

    <div id="habit-input-modal" class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-[70] flex items-center justify-center px-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl animate-slide-up text-center">
            <h3 class="font-bold text-xl mb-1 text-gray-900" id="habit-input-title">Waarde toevoegen</h3>
            <p class="text-sm text-gray-500 mb-6" id="habit-input-desc">Doel: -</p>
            <div class="flex items-center justify-center space-x-6 mb-8">
                <button onclick="window.updateHabitVal(-1)" class="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center text-2xl font-bold text-gray-600 hover:bg-gray-200 active:scale-95 transition-all">-</button>
                <input type="number" id="habit-number-val" class="w-24 bg-transparent text-4xl font-extrabold text-center outline-none text-[#20B271]">
                <button onclick="window.updateHabitVal(1)" class="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center text-2xl font-bold text-gray-600 hover:bg-gray-200 active:scale-95 transition-all">+</button>
            </div>
            <div class="flex space-x-3">
                <button onclick="window.closeHabitInput()" class="flex-1 py-4 bg-gray-100 font-bold rounded-xl text-gray-600 hover:bg-gray-200 transition-colors">Annuleren</button>
                <button onclick="window.saveHabitInput()" class="flex-1 py-4 bg-[#20B271] text-white font-bold rounded-xl shadow-lg shadow-green-200 hover:bg-[#1b9a62] transition-colors">Opslaan</button>
            </div>
        </div>
    </div>

    <!-- HOOFD MODAL (Taken, Doelen, Notities & Workouts) -->
    <div id="main-modal" class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-[60] flex items-end">
        <div class="absolute inset-0" onclick="window.closeSmartModal()"></div>
        <div class="relative bg-white w-full max-w-md mx-auto max-h-[90vh] overflow-y-auto rounded-t-[2.5rem] p-8 pb-12 animate-slide-up shadow-2xl">
            <h2 id="modal-title" class="text-2xl font-bold mb-6 text-gray-900">Nieuw Item</h2>
            
            <!-- Schakelaar voor Journal: Notitie vs Workout -->
            <div id="modal-journal-type-switch" class="hidden flex bg-gray-100 p-1.5 rounded-2xl mb-5">
                <button type="button" onclick="window.setJournalMode('note')" id="j-mode-note" class="flex-1 py-2.5 rounded-xl font-bold text-sm bg-white text-gray-900 shadow-sm transition-all">📝 Notitie</button>
                <button type="button" onclick="window.setJournalMode('workout')" id="j-mode-workout" class="flex-1 py-2.5 rounded-xl font-bold text-sm text-gray-500 transition-all">🏋️‍♂️ Workout</button>
            </div>

            <input type="text" id="modal-input" placeholder="Titel..." class="w-full p-4 bg-gray-100 rounded-2xl mb-4 outline-none focus:ring-2 focus:ring-[#20B271] text-gray-900 font-bold">
            
            <div id="modal-task-extra" class="flex items-center space-x-4 mb-4">
                <input type="time" id="time-input" class="p-4 bg-gray-100 rounded-2xl outline-none focus:ring-2 focus:ring-[#20B271] text-gray-900 font-medium">
                <span class="text-sm text-gray-500 font-medium">Tijd (optioneel)</span>
            </div>

            <div id="modal-custom-habit-extra" class="hidden flex space-x-4 mb-4">
                <input type="number" id="custom-habit-target" placeholder="Doel (bijv. 10)" class="w-1/2 p-4 bg-gray-100 rounded-2xl outline-none focus:ring-2 focus:ring-[#20B271] text-gray-900 font-medium">
                <input type="text" id="custom-habit-unit" placeholder="Eenheid (bijv. min)" class="w-1/2 p-4 bg-gray-100 rounded-2xl outline-none focus:ring-2 focus:ring-[#20B271] text-gray-900 font-medium">
            </div>

            <!-- WORKOUT BUILDER SECTIE -->
            <div id="modal-workout-extra" class="hidden mb-6 space-y-4">
                <div id="workout-exercises-container" class="space-y-4"></div>
                
                <button type="button" onclick="window.openExercisePicker()" class="w-full py-4 rounded-2xl bg-[#20B271]/10 text-[#20B271] font-bold border-2 border-dashed border-[#20B271]/40 hover:bg-[#20B271]/20 transition-colors flex justify-center items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                    Oefening kiezen
                </button>
            </div>

            <div id="modal-recurrence-extra" class="mb-8">
                <span class="text-sm text-gray-500 font-bold block mb-3 uppercase tracking-wider">Herhalen instellen</span>
                <div class="flex space-x-2 overflow-x-auto pb-2">
                    <button type="button" onclick="window.setRecurrence('none')" id="rec-btn-none" class="rec-btn px-4 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold text-sm shrink-0 transition-colors">Eenmalig</button>
                    <button type="button" onclick="window.setRecurrence('daily')" id="rec-btn-daily" class="rec-btn px-4 py-3 rounded-xl bg-[#20B271] text-white font-bold text-sm shrink-0 transition-colors">Elke dag</button>
                    <button type="button" onclick="window.setRecurrence('custom')" id="rec-btn-custom" class="rec-btn px-4 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold text-sm shrink-0 transition-colors">Kies dagen...</button>
                </div>
                
                <div id="custom-days-wrapper" class="hidden mt-3 flex justify-between space-x-1">
                    <button type="button" onclick="window.toggleCustomDay(1, this)" class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 font-bold text-xs transition-colors">Ma</button>
                    <button type="button" onclick="window.toggleCustomDay(2, this)" class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 font-bold text-xs transition-colors">Di</button>
                    <button type="button" onclick="window.toggleCustomDay(3, this)" class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 font-bold text-xs transition-colors">Wo</button>
                    <button type="button" onclick="window.toggleCustomDay(4, this)" class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 font-bold text-xs transition-colors">Do</button>
                    <button type="button" onclick="window.toggleCustomDay(5, this)" class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 font-bold text-xs transition-colors">Vr</button>
                    <button type="button" onclick="window.toggleCustomDay(6, this)" class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 font-bold text-xs transition-colors">Za</button>
                    <button type="button" onclick="window.toggleCustomDay(0, this)" class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 font-bold text-xs transition-colors">Zo</button>
                </div>
            </div>

            <div class="flex space-x-4">
                <button onclick="window.closeSmartModal()" class="flex-1 p-4 bg-gray-100 text-gray-600 rounded-2xl font-bold hover:bg-gray-200 transition-colors">Annuleren</button>
                <button onclick="window.saveSmartItem()" class="flex-1 p-4 bg-[#20B271] text-white rounded-2xl font-bold shadow-lg shadow-green-200 hover:bg-[#1b9a62] transition-colors">Opslaan</button>
            </div>
        </div>
    </div>

    <!-- POPUP VENSTER: OEFENING KIEZEN PER SPIERGROEP -->
    <div id="exercise-picker-modal" class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-[80] flex items-end sm:items-center justify-center">
        <div class="absolute inset-0" onclick="window.closeExercisePicker()"></div>
        <div class="relative bg-white w-full max-w-md rounded-t-[2.5rem] sm:rounded-[2.5rem] p-6 pb-10 max-h-[85vh] flex flex-col animate-slide-up shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-900">Kies een oefening</h3>
                <button onclick="window.closeExercisePicker()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 font-bold hover:bg-gray-200">✕</button>
            </div>

            <!-- Zoekbalk voor oefeningen -->
            <div class="relative mb-3">
                <input type="text" id="exercise-search" oninput="window.renderExercisePickerList()" placeholder="Zoek of typ eigen oefening..." class="w-full p-3.5 pl-10 bg-gray-100 rounded-2xl outline-none focus:ring-2 focus:ring-[#20B271] text-sm font-medium text-gray-900">
                <svg class="w-4 h-4 absolute left-3.5 top-1/2 transform -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>

            <!-- Spiergroep Tabs -->
            <div id="muscle-group-tabs" class="flex space-x-2 overflow-x-auto pb-3 mb-2 shrink-0"></div>

            <!-- Lijst met oefeningen -->
            <div id="exercise-picker-list" class="overflow-y-auto space-y-2 flex-1 pr-1"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1Pm8LrSl7LmuRdRP-pYl_N9RBiI9Ktv4",
            authDomain: "todoplanner-965eb.firebaseapp.com",
            projectId: "todoplanner-965eb",
            storageBucket: "todoplanner-965eb.firebasestorage.app",
            messagingSenderId: "288993132473",
            appId: "1:288993132473:web:0ec5ba55d05267dcaec068"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.loginWithGoogle = () => signInWithPopup(auth, provider).catch(error => console.error(error));
        window.logoutGoogle = () => { if(confirm("Weet je zeker dat je wilt uitloggen?")) signOut(auth); };

        window.syncToCloud = async () => {
            if(!window.currentUser) return;
            try { 
                const timestamp = parseInt(localStorage.getItem('lastUpdated')) || Date.now();
                await setDoc(doc(db, "users", window.currentUser.uid), { 
                    tasks: window.tasks, 
                    habits: window.habits, 
                    journalNotes: window.journalNotes,
                    lastUpdated: timestamp
                }); 
            } catch(e) { console.error("Save error:", e); }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUser = user;
                const loginScreen = document.getElementById('login-screen');
                loginScreen.classList.add('animate-fade-out');
                setTimeout(() => loginScreen.classList.add('hidden'), 500);

                const firstName = user.displayName ? user.displayName.split(' ')[0] : 'daar';
                document.getElementById('user-greeting').innerHTML = `Hi ${firstName},<br>focus voor vandaag?`;
                const photo = user.photoURL ? user.photoURL : `https://ui-avatars.com/api/?name=${firstName}&background=20B271&color=fff`;
                document.getElementById('avatar-container').innerHTML = `
                    <img src="${photo}" alt="Profiel" class="w-12 h-12 rounded-full shadow-sm border-2 border-white object-cover">
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-[#20B271] border-2 border-white rounded-full"></div>
                `;
                
                try {
                    const docSnap = await getDoc(doc(db, "users", user.uid));
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        const localTime = parseInt(localStorage.getItem('lastUpdated')) || 0;
                        const cloudTime = data.lastUpdated || 0;

                        if (cloudTime > localTime) {
                            window.tasks = data.tasks || [];
                            window.habits = data.habits || [];
                            window.journalNotes = data.journalNotes || [];
                            
                            window.tasks.forEach(t => {
                                if(t.completedHistory === undefined) {
                                    t.completedHistory = {};
                                    if(t.completed !== undefined) { t.completedHistory[t.dateKey] = t.completed; }
                                }
                            });

                            localStorage.setItem('cleanTasks', JSON.stringify(window.tasks));
                            localStorage.setItem('cleanHabits', JSON.stringify(window.habits));
                            localStorage.setItem('cleanJournal', JSON.stringify(window.journalNotes));
                            localStorage.setItem('lastUpdated', cloudTime.toString());
                        } else if (localTime > cloudTime) {
                            await window.syncToCloud();
                        }
                    } else {
                        await window.syncToCloud();
                    }
                    window.renderTasks(); window.renderHabits(); window.renderJournal(); window.renderDiscoverList(window.discoverChallenges);
                } catch(e) { console.error("Leesfout Firebase:", e); }

            } else {
                window.currentUser = null;
                const loginScreen = document.getElementById('login-screen');
                loginScreen.classList.remove('hidden', 'animate-fade-out');
            }
        });
    </script>

    <script>
        window.tasks = JSON.parse(localStorage.getItem('cleanTasks')) || [];
        window.habits = JSON.parse(localStorage.getItem('cleanHabits')) || [];
        window.journalNotes = JSON.parse(localStorage.getItem('cleanJournal')) || [];
        window.currentTab = 'vandaag';
        window.modalMode = 'vandaag';
        window.customizingIcon = '✨';
        
        window.selectedDate = new Date();
        window.selectedDate.setHours(0,0,0,0);
        window.getDateKey = (d) => `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;

        window.saveToLocal = () => {
            localStorage.setItem('cleanTasks', JSON.stringify(window.tasks));
            localStorage.setItem('cleanHabits', JSON.stringify(window.habits));
            localStorage.setItem('cleanJournal', JSON.stringify(window.journalNotes));
            localStorage.setItem('lastUpdated', Date.now().toString());
        };

        // --- FITNESS & WORKOUT DATABASE ---
        window.exerciseDB = {
            'Borst': ['Bench Press (Barbell)', 'Incline Dumbbell Press', 'Chest Fly (Machine / Cable)', 'Push-ups', 'Chest Press Machine', 'Dips (Borst)'],
            'Rug': ['Lat Pulldown', 'Seated Cable Row', 'Barbell Row', 'Pull-ups', 'Deadlift', 'Single Arm Dumbbell Row', 'Face Pulls', 'Hyperextensions'],
            'Benen': ['Squat (Barbell)', 'Leg Press', 'Romanian Deadlift (RDL)', 'Lunges', 'Leg Extension', 'Seated Leg Curl', 'Hip Thrust', 'Calf Raises'],
            'Schouders': ['Overhead Press (OHP)', 'Dumbbell Shoulder Press', 'Lateral Raises', 'Front Raises', 'Rear Delt Fly', 'Shrugs'],
            'Armen': ['Barbell Bicep Curl', 'Dumbbell Hammer Curl', 'Preacher Curl', 'Tricep Rope Pushdown', 'Skullcrushers', 'Overhead Tricep Extension'],
            'Core': ['Plank', 'Cable Crunch', 'Hanging Leg Raises', 'Russian Twist', 'Ab Wheel Rollout', 'Sit-ups']
        };
        window.selectedMuscleGroup = 'Alle';
        window.journalEntryMode = 'note'; // 'note' of 'workout'
        window.currentWorkoutExercises = [];

        // Zoekt in de geschiedenis naar de laatste keer dat een specifieke oefening is gedaan
        window.getLastExercisePerformance = (exerciseName) => {
            const sortedNotes = [...window.journalNotes].sort((a, b) => {
                if (a.dateKey !== b.dateKey) return b.dateKey.localeCompare(a.dateKey);
                return b.id - a.id;
            });
            for (const note of sortedNotes) {
                if (note.type === 'workout' && Array.isArray(note.exercises)) {
                    const found = note.exercises.find(e => e.name.toLowerCase() === exerciseName.toLowerCase());
                    if (found && found.sets && found.sets.length > 0) {
                        return {
                            displayDate: note.displayDate || note.dateKey,
                            sets: found.sets
                        };
                    }
                }
            }
            return null;
        };

        window.setJournalMode = (mode) => {
            window.journalEntryMode = mode;
            const btnNote = document.getElementById('j-mode-note');
            const btnWorkout = document.getElementById('j-mode-workout');
            const workoutExtra = document.getElementById('modal-workout-extra');
            const modalInput = document.getElementById('modal-input');

            if (mode === 'workout') {
                btnWorkout.className = "flex-1 py-2.5 rounded-xl font-bold text-sm bg-white text-gray-900 shadow-sm transition-all";
                btnNote.className = "flex-1 py-2.5 rounded-xl font-bold text-sm text-gray-500 transition-all";
                workoutExtra.classList.remove('hidden');
                modalInput.placeholder = "Naam training (bijv. Push Day / Upperbody)...";
                window.renderWorkoutBuilder();
            } else {
                btnNote.className = "flex-1 py-2.5 rounded-xl font-bold text-sm bg-white text-gray-900 shadow-sm transition-all";
                btnWorkout.className = "flex-1 py-2.5 rounded-xl font-bold text-sm text-gray-500 transition-all";
                workoutExtra.classList.add('hidden');
                modalInput.placeholder = "Waar denk je aan?";
            }
        };

        window.openExercisePicker = () => {
            document.getElementById('exercise-search').value = '';
            window.selectedMuscleGroup = 'Alle';
            window.renderMuscleGroupTabs();
            window.renderExercisePickerList();
            document.getElementById('exercise-picker-modal').classList.remove('hidden');
        };

        window.closeExercisePicker = () => {
            document.getElementById('exercise-picker-modal').classList.add('hidden');
        };

        window.selectMuscleGroup = (group) => {
            window.selectedMuscleGroup = group;
            window.renderMuscleGroupTabs();
            window.renderExercisePickerList();
        };

        window.renderMuscleGroupTabs = () => {
            const container = document.getElementById('muscle-group-tabs');
            const groups = ['Alle', ...Object.keys(window.exerciseDB)];
            container.innerHTML = groups.map(g => {
                const active = g === window.selectedMuscleGroup;
                const cls = active ? 'bg-[#20B271] text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200';
                return `<button type="button" onclick="window.selectMuscleGroup('${g}')" class="px-3.5 py-2 rounded-xl font-bold text-xs shrink-0 transition-colors ${cls}">${g}</button>`;
            }).join('');
        };

        window.renderExercisePickerList = () => {
            const list = document.getElementById('exercise-picker-list');
            const search = document.getElementById('exercise-search').value.trim().toLowerCase();
            list.innerHTML = '';

            let items = [];
            Object.entries(window.exerciseDB).forEach(([muscle, exercises]) => {
                if (window.selectedMuscleGroup === 'Alle' || window.selectedMuscleGroup === muscle) {
                    exercises.forEach(ex => {
                        if (!search || ex.toLowerCase().includes(search) || muscle.toLowerCase().includes(search)) {
                            items.push({ name: ex, muscle: muscle });
                        }
                    });
                }
            });

            if (search.length > 0 && !items.some(i => i.name.toLowerCase() === search)) {
                const rawSearch = document.getElementById('exercise-search').value.trim();
                const safeCustom = rawSearch.replace(/'/g, "\\'");
                list.insertAdjacentHTML('beforeend', `
                    <div onclick="window.selectExerciseFromPicker('${safeCustom}', 'Eigen oefening')" class="p-3.5 rounded-2xl bg-[#20B271]/10 border border-[#20B271]/30 flex justify-between items-center cursor-pointer hover:bg-[#20B271]/20 transition-colors">
                        <div>
                            <p class="font-bold text-sm text-[#20B271]">+ "${rawSearch}" toevoegen</p>
                            <p class="text-[11px] text-gray-500 font-medium">Eigen oefening</p>
                        </div>
                        <span class="text-[#20B271] font-bold text-lg">→</span>
                    </div>
                `);
            }

            items.forEach(item => {
                const lastPerf = window.getLastExercisePerformance(item.name);
                const lastBadge = lastPerf 
                    ? `<span class="text-[10px] font-bold text-[#20B271] bg-[#20B271]/10 px-2 py-0.5 rounded-md">Laatst: ${lastPerf.sets[0].weight || 0}kg × ${lastPerf.sets[0].reps || 0}</span>` 
                    : '';
                const safeName = item.name.replace(/'/g, "\\'");

                list.insertAdjacentHTML('beforeend', `
                    <div onclick="window.selectExerciseFromPicker('${safeName}', '${item.muscle}')" class="p-3.5 rounded-2xl bg-gray-50 hover:bg-gray-100 border border-gray-100 flex justify-between items-center cursor-pointer transition-colors">
                        <div>
                            <p class="font-bold text-sm text-gray-900">${item.name}</p>
                            <div class="flex items-center space-x-2 mt-0.5">
                                <span class="text-[11px] font-semibold text-gray-400">${item.muscle}</span>
                                ${lastBadge}
                            </div>
                        </div>
                        <div class="w-8 h-8 rounded-full bg-white shadow-sm flex items-center justify-center text-[#20B271] font-bold">+</div>
                    </div>
                `);
            });
        };

        window.selectExerciseFromPicker = (name, muscle) => {
            const lastPerf = window.getLastExercisePerformance(name);
            // Vul direct de 1e set slim in op basis van de vorige keer (indien beschikbaar)
            const initialSet = (lastPerf && lastPerf.sets[0]) 
                ? { weight: lastPerf.sets[0].weight, reps: lastPerf.sets[0].reps } 
                : { weight: '', reps: '' };

            window.currentWorkoutExercises.push({
                name: name,
                muscle: muscle,
                sets: [initialSet]
            });
            window.closeExercisePicker();
            window.renderWorkoutBuilder();
        };

        window.addWorkoutSet = (exIdx) => {
            const ex = window.currentWorkoutExercises[exIdx];
            const lastPerf = window.getLastExercisePerformance(ex.name);
            const nextSetIndex = ex.sets.length;
            let defaultWeight = '';
            let defaultReps = '';

            // Kijk eerst of deze set bij de vorige training bestond, neem anders de vorige set van vandaag over
            if (lastPerf && lastPerf.sets[nextSetIndex]) {
                defaultWeight = lastPerf.sets[nextSetIndex].weight;
                defaultReps = lastPerf.sets[nextSetIndex].reps;
            } else if (ex.sets.length > 0) {
                defaultWeight = ex.sets[ex.sets.length - 1].weight;
                defaultReps = ex.sets[ex.sets.length - 1].reps;
            }
            ex.sets.push({ weight: defaultWeight, reps: defaultReps });
            window.renderWorkoutBuilder();
        };

        window.removeWorkoutSet = (exIdx, setIdx) => {
            window.currentWorkoutExercises[exIdx].sets.splice(setIdx, 1);
            if (window.currentWorkoutExercises[exIdx].sets.length === 0) {
                window.currentWorkoutExercises.splice(exIdx, 1);
            }
            window.renderWorkoutBuilder();
        };

        window.removeWorkoutExercise = (exIdx) => {
            window.currentWorkoutExercises.splice(exIdx, 1);
            window.renderWorkoutBuilder();
        };

        window.updateSetData = (exIdx, setIdx, field, val) => {
            window.currentWorkoutExercises[exIdx].sets[setIdx][field] = val;
        };

        window.renderWorkoutBuilder = () => {
            const container = document.getElementById('workout-exercises-container');
            container.innerHTML = '';

            if (window.currentWorkoutExercises.length === 0) {
                container.innerHTML = `<div class="p-4 rounded-2xl bg-gray-50 border border-gray-100 text-center text-xs text-gray-400 font-medium">Nog geen oefeningen toegevoegd aan deze workout.</div>`;
                return;
            }

            window.currentWorkoutExercises.forEach((ex, exIdx) => {
                const lastPerf = window.getLastExercisePerformance(ex.name);
                let lastPerfHTML = `<div class="text-[11px] text-gray-400 font-medium mb-3">🆕 Eerste keer dat je deze oefening logt!</div>`;
                
                if (lastPerf) {
                    const setsSummary = lastPerf.sets.map(s => `${s.weight || 0}kg × ${s.reps || 0}`).join('  •  ');
                    lastPerfHTML = `
                        <div class="bg-[#20B271]/10 border border-[#20B271]/20 rounded-xl px-3 py-2 mb-3 flex items-start space-x-2">
                            <span class="text-xs">⏮️</span>
                            <div class="text-[11px] leading-tight">
                                <span class="font-bold text-[#20B271] block">Vorige keer (${lastPerf.displayDate}):</span>
                                <span class="font-semibold text-gray-700">${setsSummary}</span>
                            </div>
                        </div>
                    `;
                }

                const setsHTML = ex.sets.map((s, setIdx) => `
                    <div class="flex items-center space-x-2 mb-2">
                        <span class="w-7 text-xs font-extrabold text-gray-400 text-center">#${setIdx + 1}</span>
                        <div class="flex-1 relative">
                            <input type="number" step="0.5" value="${s.weight}" oninput="window.updateSetData(${exIdx}, ${setIdx}, 'weight', this.value)" placeholder="0" class="w-full p-2.5 pr-8 bg-white border border-gray-200 rounded-xl text-sm font-bold text-gray-900 outline-none focus:border-[#20B271] text-center">
                            <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] font-bold text-gray-400">kg</span>
                        </div>
                        <span class="text-gray-300 font-bold">×</span>
                        <div class="flex-1 relative">
                            <input type="number" value="${s.reps}" oninput="window.updateSetData(${exIdx}, ${setIdx}, 'reps', this.value)" placeholder="0" class="w-full p-2.5 pr-10 bg-white border border-gray-200 rounded-xl text-sm font-bold text-gray-900 outline-none focus:border-[#20B271] text-center">
                            <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] font-bold text-gray-400">reps</span>
                        </div>
                        <button type="button" onclick="window.removeWorkoutSet(${exIdx}, ${setIdx})" class="w-8 h-8 rounded-xl bg-gray-100 text-gray-400 hover:text-red-500 hover:bg-red-50 flex items-center justify-center font-bold text-xs transition-colors">✕</button>
                    </div>
                `).join('');

                container.insertAdjacentHTML('beforeend', `
                    <div class="p-4 rounded-2xl bg-gray-50 border border-gray-200/80">
                        <div class="flex justify-between items-center mb-2">
                            <div>
                                <span class="text-[10px] font-bold uppercase tracking-wider text-[#20B271] bg-[#20B271]/10 px-2 py-0.5 rounded-md">${ex.muscle}</span>
                                <h4 class="font-extrabold text-gray-900 text-base mt-1">${ex.name}</h4>
                            </div>
                            <button type="button" onclick="window.removeWorkoutExercise(${exIdx})" class="text-xs text-gray-400 hover:text-red-500 font-bold px-2 py-1">Verwijder</button>
                        </div>
                        ${lastPerfHTML}
                        <div class="mt-2">
                            ${setsHTML}
                        </div>
                        <button type="button" onclick="window.addWorkoutSet(${exIdx})" class="mt-2 w-full py-2 rounded-xl bg-white border border-gray-200 text-xs font-bold text-gray-700 hover:border-[#20B271] hover:text-[#20B271] transition-colors">
                            + Set toevoegen
                        </button>
                    </div>
                `);
            });
        };

        // --- HERHALING LOGICA ---
        window.currentRecurrence = 'none';
        window.customDays = [];

        window.setRecurrence = (val) => {
            window.currentRecurrence = val;
            const btns = ['none', 'daily', 'custom'];
            btns.forEach(b => {
                const el = document.getElementById('rec-btn-' + b);
                if(b === val) {
                    el.classList.replace('bg-gray-100', 'bg-[#20B271]'); el.classList.replace('text-gray-600', 'text-white');
                } else {
                    el.classList.replace('bg-[#20B271]', 'bg-gray-100'); el.classList.replace('text-white', 'text-gray-600');
                }
            });
            document.getElementById('custom-days-wrapper').classList.toggle('hidden', val !== 'custom');
        };

        window.toggleCustomDay = (dayInt, el) => {
            if(window.customDays.includes(dayInt)) {
                window.customDays = window.customDays.filter(d => d !== dayInt);
                el.classList.replace('bg-[#20B271]', 'bg-gray-100'); el.classList.replace('text-white', 'text-gray-600');
            } else {
                window.customDays.push(dayInt);
                el.classList.replace('bg-gray-100', 'bg-[#20B271]'); el.classList.replace('text-gray-600', 'text-white');
            }
        };

        window.shouldShowItem = (item, isHabit) => {
            const currentDKey = window.getDateKey(window.selectedDate);
            const todayDKey = window.getDateKey(new Date());
            
            if (item.endDate && currentDKey >= item.endDate) return false;
            
            if (isHabit) {
                if (currentDKey < item.dateKey) return false; 
                if (!item.repeat || item.repeat === 'daily') return true;
                if (Array.isArray(item.repeat)) return item.repeat.includes(window.selectedDate.getDay());
                return false;
            }

            if (item.dateKey === currentDKey) return true;

            if (!item.repeat || item.repeat === 'none') {
                if (item.completedHistory && item.completedHistory[currentDKey] === true) return true;
                if (currentDKey > item.dateKey && currentDKey <= todayDKey) {
                    const isEverCompleted = item.completedHistory && Object.values(item.completedHistory).some(val => val === true);
                    if (!isEverCompleted) return true;
                }
                return false;
            }

            if (currentDKey < item.dateKey) return false; 
            if (item.repeat === 'daily') return true;
            if (Array.isArray(item.repeat)) return item.repeat.includes(window.selectedDate.getDay());

            return false;
        };

        // --- KALENDER ---
        window.resetToToday = () => { 
            window.selectedDate = new Date(); window.selectedDate.setHours(0,0,0,0); 
            window.generateCalendar(); window.renderTasks(); window.renderHabits(); window.renderJournal();
        };

        window.selectDateFromPicker = (dateStr) => {
            if(!dateStr) return;
            const [year, month, day] = dateStr.split('-');
            window.selectedDate = new Date(year, month - 1, day);
            window.selectedDate.setHours(0,0,0,0);
            window.generateCalendar(); window.renderTasks(); window.renderHabits(); window.renderJournal();
        };

        window.selectDate = (ts) => {
            window.selectedDate = new Date(ts); 
            window.generateCalendar(); window.renderTasks(); window.renderHabits(); window.renderJournal();
        };

        window.generateCalendar = () => {
            const s = document.getElementById('calendar-strip'); s.innerHTML=""; 
            const centerDate = new Date(window.selectedDate); centerDate.setHours(0,0,0,0);
            const actualToday = new Date(); actualToday.setHours(0,0,0,0);

            document.getElementById('current-month-text').innerText = centerDate.toLocaleDateString('nl-NL',{month:'long',year:'numeric'});
            
            for(let i=-15; i<=15; i++){ 
                let d = new Date(centerDate); d.setDate(centerDate.getDate()+i); 
                const isSelected = d.getTime() === window.selectedDate.getTime();
                const isActualToday = d.getTime() === actualToday.getTime();
                
                let stylingClass = 'bg-transparent text-gray-600 hover:bg-gray-100';
                if (isSelected) { stylingClass = 'bg-[#20B271] text-white shadow-md active-day'; } 
                else if (isActualToday) { stylingClass = 'border-2 border-[#20B271] text-[#20B271] hover:bg-green-50'; }

                s.insertAdjacentHTML('beforeend',`<div data-ts="${d.getTime()}" onclick="window.selectDate(${d.getTime()})" class="calendar-item flex flex-col items-center justify-center w-12 h-16 rounded-full shrink-0 cursor-pointer transition-all ${stylingClass}"><span class="text-[10px] uppercase font-bold mb-1 pointer-events-none opacity-80">${d.toLocaleDateString('nl-NL',{weekday:'short'}).charAt(0)}</span><span class="font-bold text-lg pointer-events-none">${d.getDate()}</span></div>`); 
            }
            setTimeout(()=>{const a=document.querySelector('.active-day');if(a)a.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});},50);
        }

        // --- NAV & MODALS ---
        window.switchTab = (tab) => {
            window.currentTab = tab;
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${tab}`).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(btn => { btn.classList.remove('text-[#20B271]'); btn.classList.add('text-gray-400'); });
            document.getElementById(`nav-${tab}`).classList.remove('text-gray-400');
            document.getElementById(`nav-${tab}`).classList.add('text-[#20B271]');
            document.getElementById('calendar-container').style.display = (tab === 'ontdek') ? 'none' : 'block';
        };

        window.resetModalState = () => {
            document.getElementById('modal-input').value = "";
            document.getElementById('time-input').value = "";
            document.getElementById('custom-habit-target').value = "";
            document.getElementById('custom-habit-unit').value = "";
            window.customDays = [];
            window.currentWorkoutExercises = [];
            document.querySelectorAll('#custom-days-wrapper button').forEach(el => {
                el.classList.replace('bg-[#20B271]', 'bg-gray-100'); el.classList.replace('text-white', 'text-gray-600');
            });
        };

        window.openSmartModal = () => {
            if (window.currentTab === 'uitdaging' || window.currentTab === 'ontdek') { window.openCustomHabitModal(); return; }
            window.modalMode = window.currentTab;
            window.resetModalState();
            
            document.getElementById('main-modal').classList.remove('hidden');
            document.getElementById('modal-task-extra').classList.add('hidden');
            document.getElementById('modal-custom-habit-extra').classList.add('hidden');
            document.getElementById('modal-recurrence-extra').classList.add('hidden');
            document.getElementById('modal-journal-type-switch').classList.add('hidden');
            document.getElementById('modal-workout-extra').classList.add('hidden');

            if(window.currentTab === 'vandaag') {
                document.getElementById('modal-title').innerText = 'Nieuwe taak';
                document.getElementById('modal-input').placeholder = 'Wat ga je doen?';
                document.getElementById('modal-task-extra').classList.remove('hidden');
                document.getElementById('modal-recurrence-extra').classList.remove('hidden');
                window.setRecurrence('none'); 
            } else if (window.currentTab === 'journal') {
                document.getElementById('modal-title').innerText = 'Nieuw logboek item';
                document.getElementById('modal-journal-type-switch').classList.remove('hidden');
                window.setJournalMode('note');
            }
            setTimeout(() => document.getElementById('modal-input').focus(), 100);
        };

        window.openCustomHabitModal = () => {
            window.modalMode = 'custom_habit'; window.customizingIcon = '✨';
            window.resetModalState();

            document.getElementById('main-modal').classList.remove('hidden');
            document.getElementById('modal-title').innerText = 'Nieuw doel';
            document.getElementById('modal-input').placeholder = 'Naam (bijv. Gitaar spelen)';
            document.getElementById('modal-task-extra').classList.add('hidden');
            document.getElementById('modal-journal-type-switch').classList.add('hidden');
            document.getElementById('modal-workout-extra').classList.add('hidden');
            document.getElementById('modal-custom-habit-extra').classList.remove('hidden');
            document.getElementById('modal-recurrence-extra').classList.remove('hidden');
            
            window.setRecurrence('daily'); 
            setTimeout(() => document.getElementById('modal-input').focus(), 100);
        };

        window.openCustomizeDiscover = (id) => {
            const challenge = window.discoverChallenges.find(c => c.id === id);
            if(!challenge) return;
            window.modalMode = 'custom_habit'; window.customizingIcon = challenge.icon;
            window.resetModalState();

            document.getElementById('main-modal').classList.remove('hidden');

            return habit.history[dateKey] || 0;
        };

        window.setHabitProgress = (habit, dateKey, val) => {
            if (!habit.history) habit.history = {};

            if (val > habit.target) val = habit.target;
            habit.history[dateKey] = val;
        };

            let currentProgress = window.getHabitProgress(h, dKey);

            if(currentProgress < h.target) {
                window.setHabitProgress(h, dKey, currentProgress + 1);
                window.saveToLocal(); window.renderHabits();
                if(typeof window.syncToCloud === 'function') window.syncToCloud();
            }
        };

            if (val > h.target) val = h.target; 
            input.value = val;

            {title: 'Lachen in de spiegel', target: 1, unit: 'keer', icon: '😄'}, {title: 'To-do lijst maken', target: 1, unit: 'keer', icon: '📋'},
            {title: 'Visualiseren', target: 5, unit: 'min', icon: '👁️'}, {title: 'Koffievrij', target: 1, unit: 'dag', icon: '🍵'},
            {title: 'Zelf bakken', target: 1, unit: 'keer', icon: '🍞'}, {title: 'Puzzelen', target: 15, unit: 'min', icon: '🧩'},
            {title: 'Mailbox zero', target: 15, unit: 'min', icon: '📧'}, {title: 'Vreemde groeten', target: 1, unit: 'keer', icon: '🗣️'},
            {title: 'Lezen in bed', target: 15, unit: 'min', icon: '📖'}, {title: 'Kast opruimen', target: 15, unit: 'min', icon: '👗'},
            {title: 'Vrijwilligerswerk', target: 1, unit: 'uur', icon: '🤝'}, {title: 'Foto maken', target: 1, unit: 'keer', icon: '📸'},
            {title: 'Meezingen', target: 1, unit: 'keer', icon: '🎤'}, {title: 'Bordspel spelen', target: 1, unit: 'keer', icon: '🎲'},
            {title: 'Bedankje sturen', target: 1, unit: 'keer', icon: '✉️'}, {title: 'Vegetarisch eten', target: 1, unit: 'dag', icon: '🥦'},
            {title: 'Water bij opstaan', target: 1, unit: 'glas', icon: '🥛'}, {title: 'Nieuw feitje leren', target: 1, unit: 'keer', icon: '💡'},
            {title: 'Niet klagen', target: 1, unit: 'dag', icon: '🤐'}, {title: 'Recyclen', target: 1, unit: 'dag', icon: '♻️'},
            {title: 'Financiën checken', target: 15, unit: 'min', icon: '💰'}, {title: 'Pc opschonen', target: 15, unit: 'min', icon: '💻'},
            {title: 'Huisdier knuffelen', target: 1, unit: 'keer', icon: '🐶'}, {title: 'Planten water geven', target: 1, unit: 'keer', icon: '🪴'},
            {title: 'Vloggen', target: 1, unit: 'video', icon: '🎥'}, {title: 'Meditatiewandeling', target: 20, unit: 'min', icon: '🚶‍♀️'}
        ]; 
        window.discoverChallenges = rawC.map((c, index) => ({ ...c, id: 'disc_' + index }));
        
        window.filterDiscover = () => {
            const term = document.getElementById('search-discover').value.toLowerCase();
            const filtered = window.discoverChallenges.filter(c => c.title.toLowerCase().includes(term));
            window.renderDiscoverList(filtered);
        };

        window.renderDiscoverList = (listToRender) => {
            const l = document.getElementById('discover-list'); l.innerHTML = "";
            if(listToRender.length === 0) { l.innerHTML = `<p class="col-span-2 text-center text-gray-400 text-sm">Geen doelen gevonden.</p>`; return;}
            listToRender.forEach((c) => {
                l.insertAdjacentHTML('beforeend', `
                    <div onclick="window.openCustomizeDiscover('${c.id}')" class="cursor-pointer bg-white p-4 rounded-[2rem] border border-gray-100 shadow-sm flex flex-col items-center text-center hover:border-[#20B271] transition-colors">
                        <span class="text-3xl mb-2 pointer-events-none">${c.icon}</span>
                        <h3 class="font-bold text-gray-900 text-sm leading-tight pointer-events-none">${c.title}</h3>
                        <p class="text-[10px] font-semibold text-gray-400 mt-1 pointer-events-none">${c.target} ${c.unit}</p>
                        <button onclick="event.stopPropagation(); window.addDisc('${c.title}', ${c.target}, '${c.unit}', '${c.icon}', this)" class="mt-3 w-full py-2 bg-gray-50 rounded-xl text-xs font-bold text-[#20B271] hover:bg-gray-100 transition-colors">
                            + Voeg toe
                        </button>
                    </div>
                `);
            });
        };
        
        window.addDisc = (t, tg, u, i, btn) => { 
            if(!window.habits.some(h=>h.title===t)){ 
                window.habits.push({id:Date.now(), title:t, history:{}, target:tg, unit:u, icon:i, dateKey: window.getDateKey(window.selectedDate), repeat: 'daily'}); 
                window.saveToLocal(); window.renderHabits(); 
                if(typeof window.syncToCloud === 'function') window.syncToCloud(); 
            } 
            btn.innerHTML='✓ Toegevoegd'; btn.classList.replace('bg-gray-50','bg-[#20B271]'); btn.classList.replace('text-[#20B271]','text-white');
            setTimeout(()=>{btn.innerHTML='+ Voeg toe'; btn.classList.replace('bg-[#20B271]','bg-gray-50'); btn.classList.replace('text-white','text-[#20B271]');}, 1500);
        };

        // ALTIJD DIRECT TEKENEN
        window.generateCalendar();
        window.renderDiscoverList(window.discoverChallenges); 
        window.renderTasks();
        window.renderHabits();
        window.renderJournal();

    </script>
</body>
